name: Test Setup Node

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Actions
        uses: ./setup-node

      - name: Test
        run: |
          node -v
          bun -v
          pnpm -v
