name: Node Setup
description: Setup Bun, Node.js, pnpm and install dependencies

inputs:
  bun-version:
    description: Bun version
    required: false
    default: latest
  node-version:
    description: Node.js version
    required: false
    default: '24'
  pnpm-version:
    description: pnpm version (optional if packageManager is set in package.json)
    required: false
  cache-dependency-path:
    description: Path to pnpm lockfile used for caching
    required: false
    default: '**/pnpm-lock.yaml'
  run-install:
    description: Whether to run pnpm install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - if: ${{ inputs.pnpm-version != '' }}
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - if: ${{ inputs.pnpm-version == '' }}
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # Caching needs a lockfile. Disable setup-node's automatic npm cache
        # when this composite action is used without one.
        cache: ${{ hashFiles(inputs.cache-dependency-path) != '' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        package-manager-cache: false

    - if: ${{ inputs.run-install == 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
