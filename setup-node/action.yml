name: Node Setup
description: Setup Bun, Node.js, pnpm and install dependencies

inputs:
  bun-version:
    description: Bun version
    required: false
    default: latest
  node-version:
    description: Node.js version
    required: false
    default: '24'
  pnpm-version:
    description: pnpm version (optional if packageManager is set in package.json)
    required: false
  cache-dependency-path:
    description: Path to pnpm lockfile used for caching
    required: false
    default: '**/pnpm-lock.yaml'
  run-install:
    description: Whether to run pnpm install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - if: ${{ inputs.pnpm-version != '' }}
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - if: ${{ inputs.pnpm-version == '' }}
      uses: pnpm/action-setup@v6

    # setup-node requires a lockfile to create a pnpm cache key. Repositories
    # that use this action only to set up the toolchain may not have one.
    - name: Setup Node.js with pnpm cache
      if: ${{ hashFiles(inputs.cache-dependency-path) != '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Setup Node.js
      if: ${{ hashFiles(inputs.cache-dependency-path) == '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - if: ${{ inputs.run-install == 'true' }}
      run: pnpm install
      shell: bash
